<div>
  <p class="text-sm text-base-content/70">The total score sets the level. Relevance is criterion A.</p>
  <div class="mt-2 grid gap-3 sm:grid-cols-3">
    <label class="flex flex-col gap-1"><span>High needs a total of at least</span><input type="number" name="high_min_total" value="{{ thresholds.high.min_total }}" min="0" required class="input"></label>
    <label class="flex flex-col gap-1"><span>High needs relevance of at least</span><input type="number" name="high_min_a" value="{{ thresholds.high.min_A }}" min="0" required class="input"></label>
    <label class="flex flex-col gap-1"><span>Moderate needs a total of at least</span><input type="number" name="moderate_min_total" value="{{ thresholds.moderate.min_total }}" min="0" required class="input"></label>
  </div>
  <div class="mt-3 grid gap-3 sm:grid-cols-3">
    {% for a, cap in a_caps %}
    <label class="flex flex-col gap-1"><span>Relevance of {{ a }} caps the level at</span>
      <select name="a_cap_{{ a }}" class="select">{% for level in level_ids %}<option value="{{ level }}"{% if level == cap %} selected{% endif %}>{{ level|lower|capfirst }}</option>{% endfor %}</select>
    </label>
    {% endfor %}
  </div>
  <div class="mt-3 grid gap-3 sm:grid-cols-3">
    {% for level, action in levels %}
    <label class="flex flex-col gap-1"><span>Next step for {% include "_badge.html" %}</span><input type="text" name="action_{{ level }}" value="{{ action }}" class="input"></label>
    {% endfor %}
  </div>
</div>
