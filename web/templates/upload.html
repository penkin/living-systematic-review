{% extends "base.html" %}
{% block content %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <p><label>Records CSV <input type="file" name="cards" accept=".csv,text/csv" required></label></p>
  <p class="muted">Needs the columns <code>record_id</code>, <code>title</code>, <code>abstract</code>.</p>
  <button type="submit">Upload</button>
</form>
{% endblock %}
