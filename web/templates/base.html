{% load static %}<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Update Signal{% endblock %}</title>
<link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body class="min-h-screen bg-base-200 text-base-content">
<header class="navbar bg-base-100 shadow-sm">
  <div class="mx-auto flex w-full max-w-6xl items-center gap-2 px-2">
    <a href="{% url 'run_list' %}" class="btn btn-ghost text-lg font-bold">Update Signal</a>
    <nav class="ml-auto flex flex-wrap justify-end gap-1">{% block nav %}{% endblock %}</nav>
  </div>
</header>
<main class="mx-auto max-w-6xl p-4 pb-16 md:p-6"{% block main_attrs %}{% endblock %}>
{% block content %}{% endblock %}
</main>
<script>
// A page with data-poll is still being tagged. Swap the content in place: a full
// reload flashes and loses the scroll position every three seconds. Elements with
// an id (the record rows) then slide from their old position to their new one, so
// the reviewer can follow a row as it gets ranked.
(function () {
  const main = document.querySelector("main");
  if (!main.hasAttribute("data-poll")) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tops() {
    return new Map([...main.querySelectorAll("[id]")].map((el) => [el.id, el.getBoundingClientRect().top]));
  }
  function slide(before) {
    for (const [id, top] of before) {
      const el = document.getElementById(id);
      const dy = el ? top - el.getBoundingClientRect().top : 0;
      if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 600, easing: "ease-in-out" });
    }
  }
  function poll() {
    fetch(location.href)
      .then((response) => response.text())
      .then((html) => {
        const fresh = new DOMParser().parseFromString(html, "text/html").querySelector("main");
        const before = tops();
        main.innerHTML = fresh.innerHTML;
        if (!still) slide(before);
        main.toggleAttribute("data-poll", fresh.hasAttribute("data-poll"));
        if (main.hasAttribute("data-poll")) setTimeout(poll, 3000);
      })
      .catch(() => setTimeout(poll, 3000));
  }
  setTimeout(poll, 3000);
})();
</script>
</body>
</html>
