<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Update Signal{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 60rem; padding: 2rem 1rem; }
  h1 { font-size: 1.4rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); padding: .5rem; text-align: left; vertical-align: top; }
  .error { border-left: 4px solid crimson; padding: .5rem .75rem; }
  .muted { opacity: .7; }
</style>
</head>
<body>
<h1><a href="{% url 'upload' %}">Update Signal</a></h1>
{% block content %}{% endblock %}
</body>
</html>
