{% load static %}<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Update Signal{% endblock %}</title>
<link rel="stylesheet" href="{% static 'app.css' %}">
{% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200 text-base-content">
<header class="navbar bg-base-100 shadow-sm">
  <div class="mx-auto flex w-full max-w-6xl items-center gap-2 px-2">
    <a href="{% url 'upload' %}" class="btn btn-ghost text-lg font-bold">Update Signal</a>
    <nav class="ml-auto flex flex-wrap justify-end gap-1">{% block nav %}{% endblock %}</nav>
  </div>
</header>
<main class="mx-auto max-w-6xl p-4 pb-16 md:p-6">
{% block content %}{% endblock %}
</main>
</body>
</html>
