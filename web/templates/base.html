{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Update Signal{% endblock %}</title>
<link rel="stylesheet" href="{% static 'app.css' %}">
<script>if (localStorage.theme) document.documentElement.dataset.theme = localStorage.theme;</script>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
<header class="navbar bg-base-100 shadow-sm">
  <div class="mx-auto flex w-full max-w-6xl items-center gap-2 px-2">
    <a href="{% url 'run_list' %}" class="btn btn-ghost text-lg font-bold">Update Signal</a>
    <nav class="ml-auto flex flex-wrap justify-end gap-1">{% block nav %}{% endblock %}</nav>
    <select class="select select-ghost select-sm w-auto" aria-label="Theme" data-theme-select>
      <option value="">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
</header>
<main class="mx-auto max-w-6xl p-4 pb-16 md:p-6"{% block main_attrs %}{% endblock %}>
{% block content %}{% endblock %}
</main>
<script>
// The record filter hides rows whose text lacks the query. Delegated to the document,
// because the poll swap below replaces the input every three seconds.
function filterRows(query) {
  const main = document.querySelector("main");
  const input = main.querySelector("[data-filter]");
  if (!input) return;
  input.value = query;
  const q = query.trim().toLowerCase();
  for (const row of main.querySelectorAll("tbody tr[id]")) row.hidden = q !== "" && !row.textContent.toLowerCase().includes(q);
}
document.addEventListener("input", (event) => {
  if (event.target.matches("[data-filter]")) filterRows(event.target.value);
});

// A page with data-poll is still being tagged. Swap the content in place: a full
// reload flashes and loses the scroll position every three seconds. Elements with
// an id (the record rows) then slide from their old position to their new one, so
// the reviewer can follow a row as it gets ranked.
(function () {
  const main = document.querySelector("main");
  if (!main.hasAttribute("data-poll")) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tops() {
    return new Map([...main.querySelectorAll("[id]")].map((el) => [el.id, el.getBoundingClientRect().top]));
  }
  function slide(before) {
    for (const [id, top] of before) {
      const el = document.getElementById(id);
      const dy = el ? top - el.getBoundingClientRect().top : 0;
      if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 600, easing: "ease-in-out" });
    }
  }
  function poll() {
    fetch(location.href)
      .then((response) => response.text())
      .then((html) => {
        const fresh = new DOMParser().parseFromString(html, "text/html").querySelector("main");
        const before = tops();
        const query = main.querySelector("[data-filter]")?.value ?? "";
        main.innerHTML = fresh.innerHTML;
        filterRows(query);
        if (!still) slide(before);
        main.toggleAttribute("data-poll", fresh.hasAttribute("data-poll"));
        if (main.hasAttribute("data-poll")) setTimeout(poll, 3000);
      })
      .catch(() => setTimeout(poll, 3000));
  }
  setTimeout(poll, 3000);
})();

// The theme select. An empty value follows the system. The script in <head> applies a
// stored choice before the first paint, so a dark page never flashes light.
(function () {
  const select = document.querySelector("[data-theme-select]");
  select.value = localStorage.theme ?? "";
  select.addEventListener("change", () => {
    if (select.value) document.documentElement.dataset.theme = select.value;
    else delete document.documentElement.dataset.theme;
    localStorage.theme = select.value;
  });
})();
</script>
</body>
</html>
