# A template. Change app, primary_region and DJANGO_ALLOWED_HOSTS to your own values before you deploy. See docs/hosting.md.
app = "update-signal"
primary_region = "ams"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "update-signal.fly.dev"
  SIGNAL_DB = "/data/db.sqlite3"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
