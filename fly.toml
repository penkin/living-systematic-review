app = "signal-tool"
primary_region = "jnb"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_ALLOWED_HOSTS = "signal-tool.fly.dev"
  SIGNAL_DB = "/data/db.sqlite3"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
