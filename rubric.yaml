# Stage 1 rules. Deterministic, no model call. The review team edits this file
# without a developer present.
rubric_version: v0

# A record takes the first type whose markers match. record_type_raw is checked
# first because an export that supplies it is authoritative; title and abstract are
# the fallback, because SPEC.md section 9 only guarantees record_id, title and
# abstract. Markers are matched case-insensitively as substrings.
#
# Order matters. "Journal article (retracted)" matches both retracted and
# journal_article, and retracted must win.
record_types:
  retracted:
    lane: separate
    lane_reason: Retracted by the publisher
    markers: [retracted]

  protocol:
    lane: separate
    lane_reason: Protocol, no results reported
    markers: [study protocol, "protocol for a"]

  conference_abstract:
    lane: separate
    lane_reason: Conference abstract, methods and estimates not available
    markers: [conference abstract]

  commentary:
    lane: separate
    lane_reason: Commentary, not a study
    markers: [commentary, editorial, viewpoint]

  # A preprint only leaves the signal lane when a published version of the same
  # study is in the batch. SPEC.md section 4. See `duplicates` below.
  preprint:
    lane: signal
    markers: [preprint]

  systematic_review:
    lane: signal
    markers: [systematic review, meta-analysis]

  journal_article:
    lane: signal
    markers: [journal article]

# Applied when no marker matches anywhere.
default_record_type: journal_article

# World Bank income level ids that count as LMIC. Source: reference/worldbank_income.json.
lmic_income_levels: [LIC, LMC, UMC]
# Plain words for the World Bank ids, shown on the record page beside each country.
income_labels: {LIC: Low income, LMC: Lower-middle income, UMC: Upper-middle income, HIC: High income}

# In-batch duplicates. Titles are lower-cased, stripped of these prefixes, of any
# subtitle after a colon, and of punctuation and digits, then compared. A ratio at or
# above the threshold is a duplicate.
duplicates:
  title_similarity: 0.9
  strip_prefixes: ["preprint:"]
  preprint_lane_reason: "Preprint duplicate of {record_id}"

# A record that only reports secondary outcomes of a study already in the batch.
# Flagged, never routed out: the reviewer decides. SYN-028 is the seeded case.
secondary_report_markers: [secondary outcomes, reported elsewhere]

design_labels: &design_labels
  SR: Systematic review
  RCT: Randomised trial
  non-randomised: Non-randomised study
  cohort: Cohort study
  cross-sectional: Cross-sectional study
  qualitative: Qualitative study
  modelling: Modelling study
  other: Study

# Shown on the record page when a source field has no value.
untagged_label: Not tagged

# Every field a criterion or an override can read, in the order the rubric builder lists
# them. `source: model` fields are asked of the model with `prompt` as the sentence that
# explains them; `values` is the closed list, or absent for free text and numbers.
# `source: review` is the outcome pick, whose values are the review's outcomes.
# `source: rules` fields are set by stage 1 or the scorer, not by the model; only the
# label is editable. `labels` turns a value into plain words on the record page. `help`,
# or else `prompt`, is the sentence under a confirmable field's label there.
fields:
  - id: record_type
    label: Record type
    source: rules
    values: [retracted, protocol, conference_abstract, commentary, preprint, systematic_review, journal_article]
    labels: {retracted: Retracted, protocol: Protocol, conference_abstract: Conference abstract, commentary: Commentary, preprint: Preprint, systematic_review: Systematic review, journal_article: Journal article}
    help: What kind of publication this is.
    confirmable: true
  - id: lane
    label: Lane
    source: rules
    values: [signal, separate]
  - id: study_design
    label: Study design
    source: model
    values: [SR, RCT, non-randomised, cohort, cross-sectional, qualitative, modelling, other]
    labels: *design_labels
    prompt: The design of the study.
  - id: relevance
    label: Relevance
    source: model
    values: [Direct, Partial, Not relevant]
    prompt: How closely the record matches the review question.
    confirmable: true
  - id: outcome_touched
    label: Outcome
    source: review
    prompt: The review outcome the record reports on.
    confirmable: true
  - id: intervention_tested
    label: Tests an intervention
    source: model
    values: ["Yes", "No"]
    prompt: Yes if the record evaluates an intervention.
  - id: answers_question
    label: Answers the review question
    source: model
    values: ["Yes", "No"]
    prompt: Yes if the record's result bears on the review question above.
  - id: equity_level
    label: Equity
    source: model
    values: ["None", "Group included", "Results by factor"]
    prompt: None, Group included (a PROGRESS-Plus group is in the sample), or Results by factor (results are reported by a PROGRESS-Plus factor).
  - id: equity_factors
    label: Equity factors
    source: model
    values: [Place of residence, Race/ethnicity/culture/language, Occupation, Gender/sex, Religion, Education, Socioeconomic status, Social capital, Age, Disability, Other]
    type: list
    prompt: The PROGRESS-Plus factors the results are broken down by.
  - id: harm_reported
    label: Harm reported
    source: model
    values: ["Yes", "No", Unclear]
    prompt: Yes only if an adverse event or harm is a reported finding.
    confirmable: true
  - id: new_intervention_class
    label: New kind of intervention
    source: model
    values: ["Yes", "No"]
    prompt: Yes if the record tests a class not in the list above.
    confirmable: true
  - id: new_class_name
    label: Name of the new class
    source: model
    prompt: The name of the new intervention class, or an empty string.
  - id: policy_relevance
    label: Policy relevance
    source: model
    values: ["None", Some, Direct]
    prompt: None, Some, or Direct (the record evaluates a policy or programme).
  - id: countries_iso3
    label: Countries
    source: model
    type: list
    prompt: ISO 3166 alpha-3 codes of the study countries.
  - id: sample_size
    label: Study size
    source: model
    type: number
    prompt: Participants or units as an integer, or null.
  - id: lmic_setting
    label: Low- or middle-income setting
    source: rules
    values: ["Yes", "No", Mixed, Unclear]
    labels: &lmic_labels {"Yes": Low- or middle-income, Mixed: Mixed settings, "No": High-income, Unclear: Setting unclear}
  - id: recency_score
    label: Published in the update window
    source: rules
    values: [1, 0]
    labels: &recency_labels {1: Published in the update window, 0: Published before the update window}
  - id: outcome_certainty
    label: Review certainty on the outcome
    source: rules
    values: [High, Moderate, Low, Very low]
  - id: absent_context_hit
    label: Setting missing from the evidence
    source: rules
    values: ["Yes", "No"]

# Scoring criteria. Stage 3. A separate-lane record is never scored at all.
#
# Each criterion maps a source field to a score. A value that is not listed takes
# the default. Criterion A instead sums `parts`, one point each. Closed lists for
# the source fields live in review.yaml.
#
# `help` is the one-line explanation a reviewer reads beside the criterion.
# `value_labels` turns a raw value into plain words; a value without a label is
# shown as it is.
criteria:
  A:
    name: Relevance to the review question
    help: One point each for testing an intervention, answering the review question, and a low- or middle-income setting.
    max: 3
    # Decided on 2026-09-17: one point each for testing an intervention, answering
    # the review question, and an LMIC setting. Mixed and Unclear settings earn no
    # point here; criterion B still gives Mixed a point.
    parts:
      - source_field: intervention_tested
        label: Tests an intervention
        scores: {"Yes": 1}
      - source_field: answers_question
        label: Answers the review question
        scores: {"Yes": 1}
      - source_field: lmic_setting
        label: Low- or middle-income setting
        scores: {"Yes": 1}
    default: 0

  B:
    name: LMIC setting
    help: Two points for a low- or middle-income setting, one for a mixed setting.
    max: 2
    source_field: lmic_setting
    default: 0
    scores:
      Mixed: 1
      "Yes": 2
    value_labels: *lmic_labels

  C:
    name: Equity
    help: Two points when results are broken down by an equity factor, one when a disadvantaged group is included.
    max: 2
    source_field: equity_level
    default: 0
    scores:
      Group included: 1
      Results by factor: 2

  D:
    name: Study design
    help: Two points for a systematic review or a randomised trial. Every other design scores nothing.
    max: 2
    source_field: study_design
    # A systematic review or a randomised trial scores 2. Every other design scores
    # 0. There is no middle score: observational, qualitative and modelling designs
    # no longer earn a point.
    default: 0
    scores:
      SR: 2
      RCT: 2
    value_labels: *design_labels

  E:
    name: Policy relevance
    help: Two points when the record speaks directly to policy, one when it touches on it.
    max: 2
    source_field: policy_relevance
    default: 0
    scores:
      Some: 1
      Direct: 2

  F:
    name: Recency
    help: One point for a record published in the update window. A duplicate in the batch earns none.
    max: 1
    source_field: recency_score
    default: 0
    scores:
      1: 1
    value_labels: *recency_labels
    # SPEC.md section 6: a duplicate scores 0 whatever its year.
    zero_when_true: is_duplicate
    zero_when_true_label: Duplicate of another record in this batch

  G:
    name: Lands where the review is uncertain
    help: More points the less certain the review already is about this outcome. Very low certainty earns three.
    max: 3
    source_field: outcome_certainty
    # Insufficient evidence, or a certainty label the table has not used before,
    # scores like Very low.
    default: 3
    scores:
      High: 0
      Moderate: 1
      Low: 2
      Very low: 3
    value_template: "{outcome}: {certainty} certainty from {n_studies} {studies}"
    not_covered_label: Outcome not covered by the review, so no points
    not_pursued_label: Outcome the team has decided not to pursue, so no points

# Sentences for "How the level was set" on the record page. Fields: total, max,
# high_min, high_min_a, moderate_min, level, a, cap, n, label, effect.
level_steps:
  threshold: "Total {total} of {max}. High needs {high_min} or more with relevance at least {high_min_a}; Moderate needs {moderate_min} or more. That gives {level}."
  a_cap: "Relevance scored {a}, which caps the level at {cap}."
  scope_suppressed: "The outcome is outside the review and the team's setting sends such records to Low."
  out_of_region: "No country in the review's regions, so the level is capped at {cap}."
  large_study: "A study of {n} or more on a moderate-certainty outcome is promoted to High."
  override: "Override, {label}: {effect}."
  override_effects: {HIGH: level set to High, raise: level raised one step}
  overrides_skipped: "Relevance scored 0, so the overrides do not apply."
  scope_question: "Ask the team whether this outcome belongs in the review."

# Level order, lowest first. "Raise one level" walks this list.
levels: [LOW, MODERATE, HIGH]

thresholds:
  high: {min_total: 11, min_A: 2}
  moderate: {min_total: 6}
  # SPEC.md section 4: A = 1 caps at MODERATE, A = 0 is LOW whatever else scores.
  # An A = 0 record also skips the overrides, because the tree sends it straight out.
  a_caps: {0: LOW, 1: MODERATE}

# Applied in this order after the threshold. `HIGH` sets the level; `raise` moves it
# up one step. The scorer sets absent_context_hit from the record geography and the
# outcome's absent_contexts in review.yaml.
overrides:
  - name: harm
    label: harm reported
    source_field: harm_reported
    equals: "Yes"
    action: HIGH
  - name: new_class
    label: new intervention class
    source_field: new_intervention_class
    equals: "Yes"
    action: HIGH
  - name: absent_context
    label: absent context
    source_field: absent_context_hit
    equals: "Yes"
    action: raise

# The open questions in SPEC.md section 4. Switches, not code.
switches:
  promote_large_studies_on_moderate: false
  large_study_n: 1000
  # MODERATE, LOW or none. Applies when the record has a known region and none of
  # them is in review.yaml in_scope_regions. A record with no known region is not
  # capped, because unknown is not the same as elsewhere.
  out_of_region_cap: MODERATE
  # surface or suppress. Suppress still shows the record; it only forces LOW.
  out_of_scope_handling: surface

suggested_action:
  HIGH: Review now
  MODERATE: Watch
  LOW: Deprioritise

# Reason text. Fifteen words or fewer, checked in code. If the long template runs
# over, the short one is tried; only if both run over is the override clause dropped.
# Fields: design, setting, outcome, n_studies, studies (the word, singular or plural),
# certainty, override.
reason_template: "{design} in {setting} on {outcome}; review has {n_studies} {studies}, {certainty} certainty. {override}"
reason_template_short: "{outcome} in {setting}; {n_studies} {studies}, {certainty} certainty. {override}"
reason_template_scope: "Outcome outside the review; scope question for the team. {override}"
reason_override_prefix: "Override:"

# D7 regret figure: hand-sorted HIGH records outside the tool's top N by score.
regret_top_n: 10

# D7 hand sheet: the reviewers' own scoring, one row per question, one column per
# record. Each row label maps to the tool field it checks and, per answer, the tool
# values that count as agreement. An answer not listed here (blank, NA, a stray 0)
# is not compared. When the tool disagrees, the hand level is worked out with the
# first listed value. "Which outcome" reads the outcome numbers from the answer.
hand_sheet:
  "Is a finished study": {field: lane, values: {"Y": [signal], "N": [separate]}}
  "Is an intervention": {field: intervention_tested, values: {"Y": ["Yes"], "N": ["No"]}}
  "Relevant on heat?": {field: answers_question, values: {"Y": ["Yes"], "N": ["No"]}}
  "LMIC?": {field: lmic_setting, values: {"Y": ["Yes"], "N": ["No"], "M": [Mixed]}}
  "Which outcome 01-09?": {field: outcome_touched, outcomes: true, values: {"NA": [NONE]}}
  "SR/Trial": {field: study_design, values: {"Y": [SR, RCT], "N": [non-randomised, cohort, cross-sectional, qualitative, modelling, other]}, labels: {"Y": Systematic review or trial, "N": Other design}}
  "Equity": {field: equity_level, values: {"Y": [Group included, Results by factor], "N": ["None"]}}
  "Policy relevant": {field: policy_relevance, values: {"0": ["None"], "N": ["None"], "1": [Some], "2": [Direct]}}
  "Harm": {field: harm_reported, values: {"Y": ["Yes"], "N": ["No"]}}
  "new intervention": {field: new_intervention_class, values: {"Y": ["Yes"], "N": ["No"]}}
  # The reviewers' ranked file: one row per record with the tool's own columns under
  # other names. `numeric` compares the number as written.
  "Outcome": {field: outcome_touched, outcomes: true, values: {}}
  "Total": {field: signal_score, numeric: true}
  "A Rel": {field: A, numeric: true}
  "B LMIC": {field: B, numeric: true}
  "C Equity": {field: C, numeric: true}
  "D Design": {field: D, numeric: true}
  "E Policy": {field: E, numeric: true}
  "F Recency": {field: F, numeric: true}
  "G CERTAINTY": {field: G, numeric: true}
  "Review certainty": {field: outcome_certainty, values: {"VERY LOW": [Very low], "LOW": [Low], "MODERATE": [Moderate], "HIGH": [High]}}
  "Override": {field: override_triggered, values: {"HARM": [harm]}}
